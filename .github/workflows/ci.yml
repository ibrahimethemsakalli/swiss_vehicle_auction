      - name: Local proxy refund (isolated database, no providers)
        run: node --import tsx scripts/local-proxy-refund-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Local proxy ledger (isolated database, no providers)
        run: node --import tsx scripts/local-proxy-ledger-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Retention inventory (isolated database, read-only report, no providers)
        run: node --import tsx scripts/retention-inventory-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Message retention preview (isolated database, no deletion or providers)
        run: node --import tsx scripts/retention-preview-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Manual retention protection (isolated database, no providers)
        run: node --import tsx scripts/retention-protection-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Two-admin retention review (isolated database, no providers)
        run: node --import tsx scripts/retention-review-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Retention queue and inbox routing (isolated database, no providers)
        run: node --import tsx scripts/retention-routing-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Support requests (isolated database, no providers)
        run: node --import tsx scripts/support-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Support assignments and notifications (isolated database, no providers)
        run: node --import tsx scripts/support-routing-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Support queue search (isolated database, no providers)
        run: node --import tsx scripts/support-search-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

  security:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Audit lockfile (high and critical block the check)
        run: pnpm audit --audit-level high
