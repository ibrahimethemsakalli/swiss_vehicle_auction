      - name: Admin queues (isolated database, no providers)
        run: node --import tsx scripts/admin-queue-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Handover records (isolated database, no providers)
        run: node --import tsx scripts/handover-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: SEO public data and sitemap (isolated database, no providers)
        run: node --import tsx scripts/seo-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Market search SQL and performance (isolated database, no providers)
        run: node --import tsx scripts/market-search-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Private listing statistics (isolated database, no providers)
        run: node --import tsx scripts/listing-statistics-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Vehicle data origin (isolated database, no providers)
        run: node --import tsx scripts/vehicle-data-origin-tests.mjs
        env:
