name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, unit, build]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate CI configuration policy
        run: pnpm ci:lint
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/autoveri_ci_test
      - name: Run check without application secrets
        run: node scripts/ci-check.mjs ${{ matrix.check }}
      - name: Framework HTTP and Socket.IO compatibility (no DB or business workers)
        if: matrix.check == 'build'
        run: node --import tsx scripts/framework-http-tests.ts

  database-schema:
    name: database-schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: autoveri_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d autoveri_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test
      - name: Validate migrations and schema only
        run: node scripts/ci-check.mjs db
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test
      - name: Prisma 7 connection and database compatibility
        run: pnpm test:prisma
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test
      - name: Persistent notifications (isolated database, no providers)
        run: node --import tsx scripts/notification-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test
      - name: Messaging and appointments (isolated database, no providers)
        run: node --import tsx scripts/messaging-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test
      - name: Listing drafts (isolated database, no providers)
        run: node --import tsx scripts/listing-draft-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Vehicle disclosures (isolated database, no providers)
        run: node --import tsx scripts/vehicle-disclosure-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Listing revisions (isolated database, no providers)
        run: node --import tsx scripts/listing-revision-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Account favorites (isolated database, no providers)
        run: node --import tsx scripts/favorite-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Saved searches (isolated database, no providers)
        run: node --import tsx scripts/saved-search-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Vehicle location (isolated database, no providers)
        run: node --import tsx scripts/vehicle-location-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Trust and moderation (isolated database, no providers)
        run: node --import tsx scripts/trust-tests.mjs
        env:
