      - name: Dealer profile and CSV drafts (isolated database, no providers)
        run: node --import tsx scripts/dealer-inventory-tests.mjs
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/autoveri_ci_test

      - name: Local proxy lifecycle (isolated database, no providers)
        run: node --import tsx scripts/local-proxy-lifecycle-tests.mjs
        env:
